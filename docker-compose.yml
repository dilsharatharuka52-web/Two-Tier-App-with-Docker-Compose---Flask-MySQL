version: "3.8"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myapp
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net
    healthcheck:
      test: ["CMD","mysqladmin","ping","-uroot","-proot"]
      interval: 10s
      retries: 5

  flask:
    build: .
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: myapp
    networks:
      - app-net
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  db_data:
networks:
  app-net:
